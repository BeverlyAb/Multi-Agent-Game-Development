<!doctype html>

<meta charset="UTF-8" />
<title>Gacho Badi -- Dynamic Content Pipeline (Phaser)</title>
<style>
  html, body { margin: 0; padding: 0; background: #16211a; overflow: hidden; }
  #game-container { display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { image-rendering: pixelated; }

  /* Same DOM-overlay HUD pattern as UntitledGooseGame_Multi_Agent/web --
     a canvas-anchored HUD's hit-testing breaks once the camera zooms or
     follows a sprite; plain HTML overlays don't have that problem. */
  .hud-group {
    position: fixed;
    right: 20px;
    z-index: 20;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 8px;
    font-family: monospace;
  }
  #task-group { top: 16px; }
  #lore-group { top: 54px; }
  #critic-group { top: 92px; }
  #help-group { top: 130px; }

  .hud-tab {
    background: #274d2eee;
    color: #ffffff;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .hud-tab.pinned { background: #3f8a4dee; }

  .hud-panel {
    display: none;
    max-width: 420px;
    background: #000000aa;
    color: #ffffff;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 4px;
    white-space: pre-wrap;
  }
  .hud-panel.visible { display: block; }
  #help-panel { color: #d7ffd7; font-size: 12px; }
  .critic-pass { color: #9be564; }
  .critic-fail { color: #ffb0b0; }
  .task-verb-done { text-decoration: line-through; color: #9be564; }
</style>
</head>
<body>
<div id="game-container"></div>

<div class="hud-group" id="task-group">
  <div class="hud-tab" id="task-tab">📋 Task</div>
  <div class="hud-panel" id="task-panel"></div>
</div>
<div class="hud-group" id="lore-group">
  <div class="hud-tab" id="lore-tab">📖 Lore (RAG output)</div>
  <div class="hud-panel" id="lore-panel"></div>
</div>
<div class="hud-group" id="critic-group">
  <div class="hud-tab" id="critic-tab">🔍 Consistency Critic</div>
  <div class="hud-panel" id="critic-panel"></div>
</div>
<div class="hud-group" id="help-group">
  <div class="hud-tab" id="help-tab">❓ Help</div>
  <div class="hud-panel" id="help-panel">Move: WASD / Arrows   Dash: Shift
Honk: Space   Grab: E   Pick up: R   Duck: Q
The Task panel lists which of the goose's five verbs this task's
plan still needs -- perform them near the named building.</div>
</div>

<script>
  function setupHudTab(tabId, panelId) {
    const tab = document.getElementById(tabId);
    const panel = document.getElementById(panelId);
    let pinned = false;
    let hovering = false;
    const refresh = () => {
      panel.classList.toggle("visible", pinned || hovering);
      tab.classList.toggle("pinned", pinned);
    };
    tab.addEventListener("mouseenter", () => { hovering = true; refresh(); });
    tab.addEventListener("mouseleave", () => { hovering = false; refresh(); });
    tab.addEventListener("click", () => { pinned = !pinned; refresh(); });
    return { tab, panel };
  }
  window.hudTabs = {
    task: setupHudTab("task-tab", "task-panel"),
    lore: setupHudTab("lore-tab", "lore-panel"),
    critic: setupHudTab("critic-tab", "critic-panel"),
    help: setupHudTab("help-tab", "help-panel"),
  };
</script>
