<div class="hud-group" id="lore-group">

<div class="hud-group" id="help-group">
  <div class="hud-tab" id="help-tab">❓ Help</div>
  <div class="hud-panel" id="help-panel">Move: WASD / Arrows   Dash: Shift
Honk: Space   Grab: E   Drop: R   Duck: Q
The Task panel lists which of the goose's five verbs this task's
plan still needs -- perform them near the named building.</div>
</div>

<script>
  function setupHudTab(tabId, panelId) {
    const tab = document.getElementById(tabId);
    const panel = document.getElementById(panelId);
    let pinned = false;
    let hovering = false;
    const refresh = () => {
      panel.classList.toggle("visible", pinned || hovering);
      tab.classList.toggle("pinned", pinned);
    };
    tab.addEventListener("mouseenter", () => { hovering = true; refresh(); });
    tab.addEventListener("mouseleave", () => { hovering = false; refresh(); });
    tab.addEventListener("click", () => { pinned = !pinned; refresh(); });
    return { tab, panel };
  }
  window.hudTabs = {
    task: setupHudTab("task-tab", "task-panel"),
    lore: setupHudTab("lore-tab", "lore-panel"),
    help: setupHudTab("help-tab", "help-panel"),
  };
</script>
